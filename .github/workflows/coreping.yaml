name: "CorePing - Core PR Review Reminder"

on:
  # The 5-minute schedule is off: the reminder posts to #develop, which was
  # archived on 2026-10-13, so every scheduled run since has failed with
  # is_archived. To restore it: choose a live channel in coreping.ts
  # (slackChannelName); clear the stored Slack URLs that point into #develop
  # (Meta.lastSlackMessage and each ComfyCorePRs task's lastPingMessage), or the
  # first ping tries to edit a #develop message in the new channel and fails;
  # then add the schedule back:
  #   schedule:
  #     - cron: "*/5 * * * *"
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - ".github/workflows/coreping.yaml"
  #     - "app/tasks/coreping/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run_coreping:
    runs-on: ubuntu-latest
    env:
      GH_ETAG_CACHE_FILE: .gh-etag-cache.sqlite
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.GH_ETAG_CACHE_FILE }}
            ${{ env.GH_ETAG_CACHE_FILE }}-journal
          key: gh-etag-coreping-${{ github.run_id }}
          restore-keys: gh-etag-coreping-

      # Install dependencies
      - run: bun i

      # Run CorePing task
      - run: bun app/tasks/coreping/coreping.ts
        timeout-minutes: 8
        env:
          GH_TOKEN_COMFY_PR: ${{ secrets.GH_TOKEN_COMFY_PR_BOT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SLACK_BOT_CHANNEL: ${{ secrets.SLACK_BOT_CHANNEL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - uses: actions/cache/save@v5
        if: always() && github.event_name != 'pull_request'
        with:
          path: |
            ${{ env.GH_ETAG_CACHE_FILE }}
            ${{ env.GH_ETAG_CACHE_FILE }}-journal
          key: gh-etag-coreping-${{ github.run_id }}
